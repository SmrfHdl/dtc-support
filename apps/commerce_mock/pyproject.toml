[project]
name = "commerce-mock"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dtc-contracts",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "dtc-policy",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "logfire[fastapi,asyncpg]>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_mock"]

[tool.uv.sources]
dtc-contracts = { workspace = true }
dtc-policy = { workspace = true }
