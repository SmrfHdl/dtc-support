# Local dev stack (P0). Credentials are for local use only.
name: dtc-support

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dtc
      POSTGRES_PASSWORD: dtc
      POSTGRES_DB: dtc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtc -d dtc"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  commerce-mock:
    build:
      context: ../..
      dockerfile: deploy/docker/commerce-mock.Dockerfile
    environment:
      COMMERCE_DATABASE_URL: postgresql+asyncpg://dtc:dtc@postgres:5432/dtc
      MOCK_NOW: ${MOCK_NOW:-2026-09-28T12:00:00Z}
      MOCK_LATENCY_P50_MS: ${MOCK_LATENCY_P50_MS:-0}
      MOCK_LATENCY_P99_MS: ${MOCK_LATENCY_P99_MS:-0}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-0}
    env_file:
      - path: ../../.env  # LOGFIRE_TOKEN (optional; traces stay local without it)
        required: false
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s        # steady state: one probe every 30s
      start_period: 30s
      start_interval: 1s   # while starting: every 1s, so `up --wait` stays fast
      timeout: 3s
      retries: 3

volumes:
  pgdata:
