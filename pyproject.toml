[project]
name = "dtc-support"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "dtc-contracts",
    "dtc-policy",
    "commerce-mock",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.1",
    "types-pyyaml",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
dtc-contracts = { workspace = true }
dtc-policy = { workspace = true }
commerce-mock = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["dtc_contracts", "dtc_policy", "commerce_mock"]

[tool.pyright]
include = ["packages", "apps"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = ["integration: needs a running Postgres (COMMERCE_DATABASE_URL)"]

[tool.coverage.report]
show_missing = true
