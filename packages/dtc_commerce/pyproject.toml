[project]
name = "dtc-commerce"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["dtc-contracts", "httpx>=0.27"]

[tool.uv.sources]
dtc-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtc_commerce"]
