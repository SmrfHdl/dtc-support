[project]
name = "dtc-datagen"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["dtc-contracts", "dtc-policy", "asyncpg>=0.29"]

[project.scripts]
datagen = "dtc_datagen.cli:main"

[tool.uv.sources]
dtc-contracts = { workspace = true }
dtc-policy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtc_datagen"]
