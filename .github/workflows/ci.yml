name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - name: Tests (policy must have 100% branch coverage)
        run: >
          uv run pytest packages/dtc_policy
          --cov=dtc_policy --cov-branch --cov-fail-under=100
      - name: Tests (all)
        run: uv run pytest
