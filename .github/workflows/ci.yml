name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dtc
          POSTGRES_PASSWORD: dtc
          POSTGRES_DB: dtc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtc -d dtc"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      COMMERCE_DATABASE_URL: postgresql+asyncpg://dtc:dtc@localhost:5432/dtc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - name: Tests (policy must have 100% branch coverage)
        run: >
          uv run pytest packages/dtc_policy
          --cov=dtc_policy --cov-branch --cov-fail-under=100
      - name: Tests (all)
        run: uv run pytest
